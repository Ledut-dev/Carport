<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Opret forespørgsel</title>
    <link rel="stylesheet" href="css/order-form-style.css">
</head>
<body>
<div id="form-container">
    <form class="formula" method="POST" action="/create-order" id="order-form">

        <div class="form-fields">

            <div class="form-option">
                <label for="name">Navn</label>
                <input type="text" id="name" name="name" placeholder="Navn" required>
            </div>

            <div class="form-option">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="E-mail" required>
            </div>

            <div class="form-option">
                <label for="address">Adresse</label>
                <input type="text" id="address" name="address" placeholder="Adresse" required>
            </div>

            <div class="form-option">
                <label for="zipCode">Postnummer</label>
                <input type="number" id="zipCode" name="zipCode" placeholder="Postnummer" required>
            </div>

            <div class="form-option">
                <label for="phoneNumber">Telefonnummer</label>
                <!--pattern here means only digits from 0-9, with a minimum of 8 and maximum of 15 digits.
                Currently, we're not allowing + and country codes, although the validation on that itself is not too difficult.
                Rather potentially need to talk over how we handle it on the backend (if we handle it at all or just store it as a string :))-->
                <input type="tel"
                       pattern="[0-9]{8,15}"
                       id="phoneNumber"
                       name="phonenumber"
                       placeholder="Telefonnummer"
                       title="Telefonnummer skal være 8-15 cifre"
                       required>
                <!--pattern-error is the error message shown when the input doesn't match our specified pattern-->
                <span class="pattern-error">Skal være 8-15 cifre</span>
            </div>

            <div class="form-option">
                <label for="depth">Længde</label>
                <div class="input-with-unit">
                    <input type="number" id="depth" name="depth" placeholder="Længde i cm" min="300" max="900" required>
                    <span>cm</span>
                </div>
                <!--range-error is the error message shown when the input is out of range of min/max.
                 At the moment, the message-details are hard-coded in the HTML doc, but possible it can be done via Thymeleaf fetching specific min/max values from an object-->
                <span class="range-error">Skal være et helt tal mellem 300 og 900 cm</span>
            </div>

            <div class="form-option">
                <label for="width">Bredde</label>
                <div class="input-with-unit">
                    <input type="number" id="width" name="width" placeholder="Bredde i cm" min="250" max="700" required>
                    <span>cm</span>
                </div>
                <span class="range-error">Skal være et helt tal mellem 250 og 700 cm</span>
            </div>

            <div class="form-option">
                <label for="height">Højde</label>
                <div class="input-with-unit">
                    <input type="number" id="height" name="height" placeholder="Højde i cm" min="200" max="400" required>
                    <span>cm</span>
                </div>
                <span class="range-error">Skal være et helt tal mellem 200 og 400 cm</span>
            </div>

            <div id="form-button">
                <button type="submit">Send forespørgsel</button>
            </div>
    </form>
</div>

</body>
</html>
