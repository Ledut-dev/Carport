<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="css/color.css">
    <link rel="stylesheet" href="css/tab-box-style.css">

    <script src="js/order-overview.js" defer></script>
</head>
<body>

<div class="tab-box">

    <!-- role = screenreader info
    aria : accecible rich internet aplications
    aria-selected = sscreenreader info, screenreader cannot read classnames
    data-tab : custom attribute, JavaScript(fx.) gets it via .tab -->

    <div class="tab-buttons" role="tablist">
        <button class="tab-btn active" role="tab" aria-selected="true" data-tab="tab-1">Kunde</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="tab-2">Dimensioner</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="tab-3">Stykliste</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="tab-4">Illustration</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="tab-5">Resumé</button>
    </div>

    <div class="tab-content active" id="tab-1" role="tabpanel">
        <h2>Indhold til KUNDE fane.</h2>
        <form type="submit" action="#">
            <label for="kunde">Fornavn</label>
            <input type="text" id="kunde" placeholder="f.eks. Hans"> </input> <br>
            <label for="email">E-mail</label>
            <input type="text" id="email" placeholder="@gmail.com"> </input> <br>
            <button type="submit">indsend</button>
        </form>
    </div>
    <div class="tab-content" id="tab-2" role="tabpanel">
        <h2>Indhold til DIMENSIONER fane.</h2>
    </div>
    <div class="tab-content" id="tab-3" role="tabpanel">
        <h2>Indhold til STYKLISTE fane.</h2>
    </div>
    <div class="tab-content" id="tab-4" role="tabpanel">
        <h2>Indhold til ILLUSTRATION fane.</h2>
    </div>
    <div class="tab-content" id="tab-5" role="tabpanel">
        <h2>Indhold til ORDRE RESUME fane.</h2>
    </div>
</div>


</body>
</html>
